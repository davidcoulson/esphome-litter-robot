# Cat sync package: shared weight per cat + visit/poop/pee counts summed across robots.
# Include with:  homeassistant: { packages: { cat_sync: !include cat-sync/cat_sync.yaml } }
# Totals sum entities you list explicitly: after installing, open each helper
# "Cat N <counter> entities" and paste the full entity ids of that cat's sensor on every
# robot, comma separated (e.g. sensor.robot_a_meg_visits,sensor.robot_b_meg_visits).
# Nothing is guessed from device names, so renaming entities or devices cannot break it
# silently: a total goes unavailable until every listed entity has a number.
input_text:
  cat_1_visits_entities:
    name: "Cat 1 Visits entities"
    max: 255
    icon: mdi:cat
  cat_1_poop_entities:
    name: "Cat 1 Poop Count entities"
    max: 255
    icon: mdi:poop
  cat_1_pee_entities:
    name: "Cat 1 Pee Count entities"
    max: 255
    icon: mdi:water
  cat_2_visits_entities:
    name: "Cat 2 Visits entities"
    max: 255
    icon: mdi:cat
  cat_2_poop_entities:
    name: "Cat 2 Poop Count entities"
    max: 255
    icon: mdi:poop
  cat_2_pee_entities:
    name: "Cat 2 Pee Count entities"
    max: 255
    icon: mdi:water
  cat_3_visits_entities:
    name: "Cat 3 Visits entities"
    max: 255
    icon: mdi:cat
  cat_3_poop_entities:
    name: "Cat 3 Poop Count entities"
    max: 255
    icon: mdi:poop
  cat_3_pee_entities:
    name: "Cat 3 Pee Count entities"
    max: 255
    icon: mdi:water
  cat_4_visits_entities:
    name: "Cat 4 Visits entities"
    max: 255
    icon: mdi:cat
  cat_4_poop_entities:
    name: "Cat 4 Poop Count entities"
    max: 255
    icon: mdi:poop
  cat_4_pee_entities:
    name: "Cat 4 Pee Count entities"
    max: 255
    icon: mdi:water
  cat_5_visits_entities:
    name: "Cat 5 Visits entities"
    max: 255
    icon: mdi:cat
  cat_5_poop_entities:
    name: "Cat 5 Poop Count entities"
    max: 255
    icon: mdi:poop
  cat_5_pee_entities:
    name: "Cat 5 Pee Count entities"
    max: 255
    icon: mdi:water
  cat_6_visits_entities:
    name: "Cat 6 Visits entities"
    max: 255
    icon: mdi:cat
  cat_6_poop_entities:
    name: "Cat 6 Poop Count entities"
    max: 255
    icon: mdi:poop
  cat_6_pee_entities:
    name: "Cat 6 Pee Count entities"
    max: 255
    icon: mdi:water

input_number:
  cat_1_weight:
    name: Cat 1 shared weight
    min: 0
    max: 50
    step: 0.01
    mode: box
    unit_of_measurement: lb
    icon: mdi:scale
  cat_2_weight:
    name: Cat 2 shared weight
    min: 0
    max: 50
    step: 0.01
    mode: box
    unit_of_measurement: lb
    icon: mdi:scale
  cat_3_weight:
    name: Cat 3 shared weight
    min: 0
    max: 50
    step: 0.01
    mode: box
    unit_of_measurement: lb
    icon: mdi:scale
  cat_4_weight:
    name: Cat 4 shared weight
    min: 0
    max: 50
    step: 0.01
    mode: box
    unit_of_measurement: lb
    icon: mdi:scale
  cat_5_weight:
    name: Cat 5 shared weight
    min: 0
    max: 50
    step: 0.01
    mode: box
    unit_of_measurement: lb
    icon: mdi:scale
  cat_6_weight:
    name: Cat 6 shared weight
    min: 0
    max: 50
    step: 0.01
    mode: box
    unit_of_measurement: lb
    icon: mdi:scale

template:
  - sensor:
      - name: "Cat 1 Total Visits"
        unique_id: cat_sync_cat_1_total_visits
        icon: mdi:cat
        state_class: total
        availability: >-
          {% set ids = states('input_text.cat_1_visits_entities').split(',') | map('trim') | select | list %}
          {{ ids | count > 0 and ids | map('states') | select('is_number') | list | count == ids | count }}
        state: >-
          {% set ids = states('input_text.cat_1_visits_entities').split(',') | map('trim') | select | list %}
          {{ ids | map('states') | map('float') | sum | int }}
      - name: "Cat 1 Total Poop Count"
        unique_id: cat_sync_cat_1_total_feces_count
        icon: mdi:poop
        state_class: total
        availability: >-
          {% set ids = states('input_text.cat_1_poop_entities').split(',') | map('trim') | select | list %}
