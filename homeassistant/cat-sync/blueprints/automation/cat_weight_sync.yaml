blueprint:
  name: Cat weight sync across litter robots
  description: >-
    Keeps one cat's weight identical on every robot. When a robot's cat weight
    sensor changes (after an identified visit) the value is stored in the shared
    input_number and pushed to every OTHER robot's "Set Cat N Weight". Editing the
    input_number pushes it to all robots. Loops are prevented because a change is
    only acted on when it differs from the shared value by more than the tolerance.
    A robot that comes back from unavailable is given the shared value instead of
    overwriting it with its saved one. Robots whose weight is still unknown are seeded.
  domain: automation
  input:
    shared_weight:
      name: Shared weight helper
      selector:
        entity:
          domain: input_number
    weight_sensors:
      name: Cat weight sensors (one per robot)
      selector:
        entity:
          domain: sensor
          device_class: weight
          multiple: true
    set_numbers:
      name: "Set Cat N Weight numbers (one per robot, same cat)"
      selector:
        entity:
          domain: number
          multiple: true
    tolerance:
      name: Tolerance (lb)
      description: Ignore differences up to this size. Keep it well below the robots' weight_tolerance (0.6).
      default: 0.2
      selector:
        number:
          min: 0.01
          max: 0.5
          step: 0.01
          unit_of_measurement: lb

mode: queued
max: 10

variables:
  shared: !input shared_weight
  numbers: !input set_numbers
  tol: !input tolerance

trigger:
  - platform: state
    entity_id: !input weight_sensors
    id: robot
  - platform: state
    entity_id: !input shared_weight
    id: shared

condition:
  - condition: template
    value_template: "{{ trigger.to_state is not none and trigger.to_state.state | is_number and trigger.to_state.state | float > 0 }}"
  # A queued event whose entity has changed again since is superseded: acting on it would replay an old weight.
  - condition: template
    value_template: "{{ states(trigger.entity_id) == trigger.to_state.state }}"
  # state is lb only while the sensor keeps its native unit
  - condition: template
    value_template: >-
      {{ trigger.id == 'shared' or trigger.to_state.attributes.unit_of_measurement == 'lb' }}

action:
  - variables:
      # A robot coming back (unavailable/unknown -> number) is restoring saved state, not weighing a cat.
      restored: >-
        {{ trigger.id == 'robot' and (trigger.from_state is none or trigger.from_state.state in ['unavailable', 'unknown']) }}
      value: "{{ trigger.to_state.state | float }}"
      src_device: "{{ device_id(trigger.entity_id) if trigger.id == 'robot' else none }}"
      shared_ok: "{{ states(shared) | is_number and states(shared) | float > 0 }}"
  - choose:
      # Reconnect: the shared value is the authority. Push it to that robot only, never the other way.
      - conditions:
          - condition: template
            value_template: "{{ restored }}"
        sequence:
          - condition: template
            value_template: "{{ shared_ok and (value - states(shared) | float) | abs > tol | float }}"
          - repeat:
              for_each: "{{ numbers }}"
              sequence:
                - condition: template
                  value_template: "{{ device_id(repeat.item) == src_device and states(repeat.item) != 'unavailable' }}"
                - service: number.set_value
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    value: "{{ states(shared) | float }}"
      # A real measurement or an edit of the shared helper: store it and push to the other robots.
      - conditions:
          - condition: template
            value_template: "{{ not restored }}"
        sequence:
          # loop guard: an echo of our own push equals the shared value
          - condition: template
            value_template: >-
              {{ trigger.id == 'shared' or not shared_ok or (value - states(shared) | float) | abs > tol | float }}
          - if:
              - condition: template
                value_template: "{{ trigger.id == 'robot' }}"
            then:
              - service: input_number.set_value
                target:
                  entity_id: !input shared_weight
                data:
                  value: "{{ value }}"
          - repeat:
              for_each: "{{ numbers }}"
              sequence:
                # "unknown" is an uncalibrated or just-reset tracker: that is exactly what a push should seed.
                - condition: template
                  value_template: >-
                    {{ (src_device is none or device_id(repeat.item) != src_device)
                       and states(repeat.item) != 'unavailable'
                       and ((states(repeat.item) | float(0)) - value) | abs > 0.005 }}
                - service: number.set_value
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    value: "{{ value }}"
