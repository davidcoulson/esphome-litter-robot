substitutions:
  name: litter-robot4
  friendly_name: Litter Robot 4
  version: 2026.9.0-dev

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  project:
    name: Joseph DiGiovanni.Litter Robot 4
    version: ${version}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ap:
    password: "Wh1sk3rM30wM30w"

web_server:
  auth:
    type: digest
    username: "user"
    password: "Wh1sk3rM30wM30w"
  port: 80

captive_portal:

dashboard_import:
  package_import_url: codeberg://Joseph-DiGiovanni/esphome-litter-robot/litter-robot4.yaml@main
  import_full_config: false

external_components:
  source:
    type: git
    url: https://codeberg.org/Joseph-DiGiovanni/esphome-litter-robot.git
    ref: LR4/${version}

packages:
  litter_robot4_base: !include packages/litter-robot4/base.yaml
  sleep_schedule: !include packages/litter-robot4/sleep-schedule.yaml
  cat_tracking: !include { file: packages/litter-robot4/cat-tracking.yaml, vars: { weight_sensor_id: last_cat_weight } }
  wifi: !include packages/litter-robot4/wifi.yaml
  smart_detection: !include packages/litter-robot4/smart-detection.yaml
