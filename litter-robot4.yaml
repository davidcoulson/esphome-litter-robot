substitutions:
  name: litter-robot4
  friendly_name: Litter Robot 4

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  project:
    name: Joseph-DiGiovanni.LitterRobot4
    version: "0.9.2"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ap:
    password: "Wh1sk3rM30wM30w"

web_server:
  auth:
    type: digest
    username: "user"
    password: "Wh1sk3rM30wM30w"
  port: 80

captive_portal:

dashboard_import:
  package_import_url: codeberg://Joseph-DiGiovanni/esphome-litter-robot/litter-robot4.yaml@main
  import_full_config: false

external_components:
  source:
    type: git
    url: https://codeberg.org/Joseph-DiGiovanni/esphome-litter-robot.git
    ref: LR4/0.9.2

uart:
  - id: uart_bus
    tx_pin: GPIO19
    rx_pin: GPIO5
    baud_rate: 256000
    rx_buffer_size: 2048

litter_robot4:
  id: my_litter_robot4
  time_id: ha_time

time:
  - platform: homeassistant
    timezone: America/New_York
    id: ha_time

text_sensor:
  - platform: litter_robot4
    type: status
    name: "Status"
  - platform: litter_robot4
    type: power_type
    name: "Power Type"

button:
  - platform: litter_robot4
    type: cycle
    name: "Manual Cycle"
  - platform: litter_robot4
    type: empty
    name: "Empty Litter"
  - platform: litter_robot4
    type: replace_filter
    name: "Replace Filter"
  - platform: litter_robot4
    type: factory_reset
    name: "Factory Reset"
  - platform: litter_robot4
    type: power
    name: "Power"
  - platform: litter_robot4
    type: reset
    name: "Reset"

sensor:
  - platform: litter_robot4
    type: waste_drawer_level
    name: "Waste Drawer Level"
  - platform: litter_robot4
    type: litter_level
    name: "Litter Level"
  - platform: litter_robot4
    type: cat_weight
    name: "Cat Weight"
  - platform: litter_robot4
    type: clean_cycle_count
    name: "Clean Cycles"
  - platform: litter_robot4
    type: power_cycle_count
    name: "Power Cycles"
    disabled_by_default: true
  - platform: litter_robot4
    type: empty_cycle_count
    name: "Empty Cycles"
    disabled_by_default: true
  - platform: litter_robot4
    type: filter_cycle_count
    name: "Filter Cycles"
    disabled_by_default: true

number:
  - platform: litter_robot4
    name: "Clean Cycle Delay"

select:
  - platform: litter_robot4
    type: night_light_mode
    name: "Night Light Mode"
  - platform: litter_robot4
    type: night_light_brightness
    name: "Night Light Brightness"
  - platform: litter_robot4
    type: panel_brightness
    name: "Panel Brightness"

switch:
  - platform: litter_robot4
    type: control_panel_lockout
    name: "Control Panel Lockout"
  - platform: litter_robot4
    type: sleep_schedule_sun
    name: "Sunday Sleep Schedule"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_schedule_mon
    name: "Monday Sleep Schedule"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_schedule_tue
    name: "Tuesday Sleep Schedule"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_schedule_wed
    name: "Wednesday Sleep Schedule"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_schedule_thu
    name: "Thursday Sleep Schedule"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_schedule_fri
    name: "Friday Sleep Schedule"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_schedule_sat
    name: "Saturday Sleep Schedule"
    disabled_by_default: true

datetime:
  - platform: litter_robot4
    type: sleep_sun
    name: "Sunday Sleep Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: wake_sun
    name: "Sunday Wake Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_mon
    name: "Monday Sleep Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: wake_mon
    name: "Monday Wake Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_tue
    name: "Tuesday Sleep Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: wake_tue
    name: "Tuesday Wake Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_wed
    name: "Wednesday Sleep Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: wake_wed
    name: "Wednesday Wake Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_thu
    name: "Thursday Sleep Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: wake_thu
    name: "Thursday Wake Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_fri
    name: "Friday Sleep Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: wake_fri
    name: "Friday Wake Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_sat
    name: "Saturday Sleep Time"
    disabled_by_default: true
  - platform: litter_robot4
    type: wake_sat
    name: "Saturday Wake Time"
    disabled_by_default: true

binary_sensor:
  - platform: litter_robot4
    type: waste_drawer_full
    name: "Waste Drawer Full"
  - platform: litter_robot4
    type: bonnet_removed
    name: "Bonnet Removed"
    disabled_by_default: true
  - platform: litter_robot4
    type: night_light
    name: "Night Light"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleep_status
    name: "Sleep Status"
    disabled_by_default: true
  - platform: litter_robot4
    type: fault_status
    name: "Fault Status"
