# Sensirion SGP41 VOC and NOx index on the same I2C bus as the BME688 (address
# 0x59). It samples every second internally; the readings are taken every 10 s
# and Home Assistant gets their 120 s average, like the BME688's pace. Uses the
# BME688's temperature and humidity for compensation, so it needs the WasteSense firmware.
sensor:
  - platform: sgp4x
    i2c_id: i2c_bus
    update_interval: 10s
    voc_index:
      id: sgp_voc_index
      name: "VOC Index"
      filters:
        - throttle_average: 120s
    nox_index:
      id: sgp_nox_index
      name: "NOx Index"
      filters:
        - throttle_average: 120s
    compensation:
      humidity_source: humidity
      temperature_source: temperature
