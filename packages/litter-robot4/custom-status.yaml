text_sensor:
  - platform: litter_robot4
    id: !extend robot_status
    on_value:
      - script.execute: update_status
  - platform: litter_robot4
    id: !extend power_type
    on_value:
      - script.execute: update_status
  - platform: litter_robot4
    id: !extend fault
    on_value:
      - script.execute: update_status
  - platform: template
    id: status
    name: "Status"
    icon: "mdi:information"

binary_sensor:
  - platform: litter_robot4
    id: !extend curtain_detected
    on_state:
      - script.execute: update_status
  - platform: litter_robot4
    id: !extend weight_detected
    on_state:
      - script.execute: update_status
  - platform: litter_robot4
    id: !extend sleeping
    on_state:
      - script.execute: update_status
  - platform: template
    id: !extend cat_confirmed
    on_state:
      - script.execute: update_status

select:
  - platform: litter_robot4
    id: !extend wifi_status
    on_value:
      then:
        - script.execute: update_status

script:
  - id: update_status
    then:
      - lambda: |-
          std::string result = id(robot_status).state;

          // A code with no name ("Unknown (0x2C0)") is logged and the shown status kept.
          // robot_status itself still changes, so guards never act on a stale "Ready".
          if (result.rfind("Unknown", 0) == 0) {
            ESP_LOGW("status", "Robot status %s has no name; keeping \"%s\"", result.c_str(), id(status).state.c_str());
            result = id(status).state;
          }

          if (result == "Cat detected" && id(curtain_detected).has_state() && id(weight_detected).has_state() &&
              !id(curtain_detected).state && !id(weight_detected).state) {
            result = "Waiting to cycle";
          } else if (result == "Clean cycle in progress" && (id(curtain_detected).state || id(weight_detected).state)) {
            result = "Cycle interrupted";
          } else if (id(sleeping).state && result == "Ready") {
            result = "Sleeping";
          }

          if (!id(fault).state.empty() && id(fault).state != "None") {
            result = "Fault detected";
          }

          if (id(power_type).state == "Battery") {
            result = "On battery";
          }

          if (id(wifi_status).current_option() == "Off") {
            result = "WiFi disabled";
          }

          if (id(smart_cat_detection).state && !id(cat_confirmed).state && (result == "Cat detected" || result == "Waiting to cycle")) {
            return;
          }

          if (!result.empty() && result != id(status).state) {
            id(status).publish_state(result);
          }
