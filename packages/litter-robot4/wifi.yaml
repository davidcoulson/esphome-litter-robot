script:
  - id: set_robot_wifi_status
    then:
      - lambda: |-
          const char *target;
          if (esphome::wifi::global_wifi_component->is_disabled()) {
            target = "Off";
          } else if (esphome::wifi::global_wifi_component->is_connected()) {
            target = "Connected";
          } else if (esphome::wifi::global_wifi_component->is_ap_active()) {
            target = "Pairing";
          } else {
            target = "Connecting";
          }
          if (id(wifi_status).current_option() != target) {
            id(wifi_status).make_call().set_option(target).perform();
          }

  - id: apply_wifi_status
    then:
      - if:
          condition:
            select.is:
              id: wifi_status
              options: ["Off"]
          then:
            - delay: 500ms # Give state time to publish before the link drops
            - wifi.disable:
          else:
            - wifi.enable:
            - script.execute: set_robot_wifi_status

interval:
  - interval: 30s
    then:
      - script.execute: set_robot_wifi_status

select:
  - platform: litter_robot4
    type: wifi_status
    id: wifi_status
    name: "WiFi Status"
    disabled_by_default: true
    on_value:
      then:
        # Defer to a script so the extended on_value actions run before wifi is disabled
        - script.execute: apply_wifi_status

wifi:
  on_connect:
    then:
      - script.execute: set_robot_wifi_status
  on_disconnect:
    then:
      - script.execute: set_robot_wifi_status
