globals:
  # User's enable/disable intent, independent of whether the BME is present.
  - id: odor_control_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'
  # A feces visit waiting to be cycled once the cat is clear of the robot.
  - id: odor_control_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  # The cat has been clear of the robot for at least the odor control delay.
  - id: odor_control_settled
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: suppress_ready
    type: bool
    restore_value: no
    initial_value: 'false'

switch:
  - platform: template
    id: odor_control
    name: "Odor Control"
    icon: "mdi:scent-off"
    entity_category: config
    restore_mode: DISABLED
    lambda: |-
      return id(odor_control_enabled) && !id(bme680).is_failed();
    turn_on_action:
      - lambda: "id(odor_control_enabled) = true;"
    turn_off_action:
      - lambda: "id(odor_control_enabled) = false;"
    on_turn_off:
      - lambda: "id(odor_control_pending) = false;"

number:
  # Minimum time the cat must be clear before a feces cycle, so the robot does
  # not start turning the moment the cat steps out.
  - platform: template
    id: odor_control_delay
    name: "Odor Control Delay"
    icon: "mdi:timer-sync"
    entity_category: config
    disabled_by_default: true
    unit_of_measurement: "min"
    mode: slider
    min_value: 0
    max_value: 10
    step: 0.5
    optimistic: true
    restore_value: true
    initial_value: 1

text_sensor:
  # Drop the transient "Ready" the robot reports between the reset and the
  # follow-up cycle press, so it never reaches the status sensor or HA.
  - id: !extend robot_status
    filters:
      - lambda: |-
          if (id(suppress_ready) && x == "Ready")
            return {};
          return x;
    on_value:
      # Any other state means the robot cycled or was reset on its own.
      - lambda: |-
          if (x != "Cat detected")
            id(odor_control_pending) = false;
      - script.execute: evaluate_odor_control

binary_sensor:
  - id: !extend weight_detected
    on_state:
      - if:
          condition:
            lambda: "return x;"
          then:
            # A new visit supersedes any pending odor control cycle.
            - lambda: "id(odor_control_pending) = false;"
            - script.stop: odor_control_cycle
            - lambda: "id(suppress_ready) = false;"
          else:
            - if:
                condition:
                  lambda: "return id(feces_detected) && id(odor_control).state;"
                then:
                  - lambda: "id(odor_control_pending) = true;"
      - script.execute: evaluate_odor_control
  - id: !extend curtain_detected
    on_state:
      - script.execute: evaluate_odor_control

script:
  # Feces is recorded as soon as it is classified, possibly while the cat is
  # still inside, so the cycle waits for the cat to clear.
  - id: !extend record_waste_visit
    then:
      - if:
          condition:
            lambda: "return id(feces_detected) && id(odor_control).state;"
          then:
            - lambda: "id(odor_control_pending) = true;"
            - script.execute: evaluate_odor_control

  # Cycles a pending feces visit once the cat has been clear for the odor
  # control delay, rather than waiting for the robot's configured clean-cycle
  # delay. The delay runs from when the cat clears, so feces detected later
  # cycles right away. Skipped while asleep or with auto cycle off, leaving the
  # visit to the robot.
  - id: evaluate_odor_control
    then:
      - lambda: |-
          const bool clear = id(odor_control).state &&
                             id(robot_status).state == "Cat detected" &&
                             !id(curtain_detected).state && !id(weight_detected).state;
          if (!clear) {
            id(odor_control_settled) = false;
            id(odor_control_settle).stop();
          } else if (!id(odor_control_settled) && !id(odor_control_settle).is_running()) {
            id(odor_control_settle).execute();
          }
          if (!id(odor_control_pending))
            return;
          if (id(sleeping).state || !id(auto_cycle).state) {
            id(odor_control_pending) = false;
            return;
          }
          if (clear && id(odor_control_settled)) {
            id(odor_control_pending) = false;
            id(odor_control_cycle).execute();
          }

  - id: odor_control_settle
    then:
      - delay: !lambda "return (uint32_t) (id(odor_control_delay).state * 60000.0f);"
      - lambda: "id(odor_control_settled) = true;"
      - script.execute: evaluate_odor_control

  # While a cycle is pending the robot stays in the "Cat detected" state, where
  # a manual cycle is ignored, so press reset first to clear it, then cycle.
  - id: odor_control_cycle
    then:
      - lambda: "id(suppress_ready) = true;"
      - button.press: reset
      - delay: 1s
      - button.press: cycle
      - delay: 1s
      - lambda: "id(suppress_ready) = false;"
