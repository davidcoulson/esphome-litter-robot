switch:
  - platform: template
    id: sleep_override
    name: "Sleep Override"
    icon: "mdi:bed-clock"
    entity_category: config
    restore_mode: DISABLED
    lambda: |-
      return id(sleep_schedule_sun).state && id(sleep_schedule_mon).state && id(sleep_schedule_tue).state &&
             id(sleep_schedule_wed).state && id(sleep_schedule_thu).state && id(sleep_schedule_fri).state &&
             id(sleep_schedule_sat).state &&
             id(sleep_sun).hour == 0 && id(sleep_sun).minute == 0 &&
             id(wake_sun).hour == 0 && id(wake_sun).minute == 0 &&
             id(sleep_mon).hour == 0 && id(sleep_mon).minute == 0 &&
             id(wake_mon).hour == 0 && id(wake_mon).minute == 0 &&
             id(sleep_tue).hour == 0 && id(sleep_tue).minute == 0 &&
             id(wake_tue).hour == 0 && id(wake_tue).minute == 0 &&
             id(sleep_wed).hour == 0 && id(sleep_wed).minute == 0 &&
             id(wake_wed).hour == 0 && id(wake_wed).minute == 0 &&
             id(sleep_thu).hour == 0 && id(sleep_thu).minute == 0 &&
             id(wake_thu).hour == 0 && id(wake_thu).minute == 0 &&
             id(sleep_fri).hour == 0 && id(sleep_fri).minute == 0 &&
             id(wake_fri).hour == 0 && id(wake_fri).minute == 0 &&
             id(sleep_sat).hour == 0 && id(sleep_sat).minute == 0 &&
             id(wake_sat).hour == 0 && id(wake_sat).minute == 0;
    turn_on_action:
      # Remember the schedule so turning the override off can put it back.
      - lambda: |-
          if (id(sleep_override).state)
            return;
          datetime::TimeEntity *times[14] = {id(sleep_sun), id(wake_sun), id(sleep_mon), id(wake_mon), id(sleep_tue), id(wake_tue), id(sleep_wed),
                                         id(wake_wed), id(sleep_thu), id(wake_thu), id(sleep_fri), id(wake_fri), id(sleep_sat),
                                         id(wake_sat)};
          switch_::Switch *days[7] = {id(sleep_schedule_sun), id(sleep_schedule_mon), id(sleep_schedule_tue), id(sleep_schedule_wed),
                                id(sleep_schedule_thu), id(sleep_schedule_fri), id(sleep_schedule_sat)};
          for (int i = 0; i < 14; i++)
            id(saved_sleep_times)[i] = times[i]->hour * 60 + times[i]->minute;
          uint8_t mask = 0;
          for (int i = 0; i < 7; i++)
            if (days[i]->state)
              mask |= 1 << i;
          id(saved_sleep_days) = mask;
          id(saved_sleep_valid) = true;
      - datetime.time.set:
          id: sleep_sun
          time: "00:00:00"
      - datetime.time.set:
          id: wake_sun
          time: "00:00:00"
      - datetime.time.set:
          id: sleep_mon
          time: "00:00:00"
      - datetime.time.set:
          id: wake_mon
          time: "00:00:00"
      - datetime.time.set:
          id: sleep_tue
          time: "00:00:00"
      - datetime.time.set:
          id: wake_tue
          time: "00:00:00"
      - datetime.time.set:
          id: sleep_wed
          time: "00:00:00"
      - datetime.time.set:
          id: wake_wed
          time: "00:00:00"
      - datetime.time.set:
          id: sleep_thu
          time: "00:00:00"
      - datetime.time.set:
          id: wake_thu
          time: "00:00:00"
      - datetime.time.set:
          id: sleep_fri
          time: "00:00:00"
      - datetime.time.set:
          id: wake_fri
          time: "00:00:00"
      - datetime.time.set:
          id: sleep_sat
          time: "00:00:00"
      - datetime.time.set:
          id: wake_sat
          time: "00:00:00"
      - switch.turn_on: sleep_schedule_sun
      - switch.turn_on: sleep_schedule_mon
      - switch.turn_on: sleep_schedule_tue
      - switch.turn_on: sleep_schedule_wed
      - switch.turn_on: sleep_schedule_thu
      - switch.turn_on: sleep_schedule_fri
      - switch.turn_on: sleep_schedule_sat
    turn_off_action:
      - switch.turn_off: sleep_schedule_sun
      - switch.turn_off: sleep_schedule_mon
      - switch.turn_off: sleep_schedule_tue
      - switch.turn_off: sleep_schedule_wed
      - switch.turn_off: sleep_schedule_thu
      - switch.turn_off: sleep_schedule_fri
      - switch.turn_off: sleep_schedule_sat
      # Restore the schedule saved when the override was turned on (days off, times, then days).
      - lambda: |-
          if (!id(saved_sleep_valid))
            return;
          datetime::TimeEntity *times[14] = {id(sleep_sun), id(wake_sun), id(sleep_mon), id(wake_mon), id(sleep_tue), id(wake_tue), id(sleep_wed),
                                         id(wake_wed), id(sleep_thu), id(wake_thu), id(sleep_fri), id(wake_fri), id(sleep_sat),
                                         id(wake_sat)};
          switch_::Switch *days[7] = {id(sleep_schedule_sun), id(sleep_schedule_mon), id(sleep_schedule_tue), id(sleep_schedule_wed),
                                id(sleep_schedule_thu), id(sleep_schedule_fri), id(sleep_schedule_sat)};
          for (int i = 0; i < 14; i++) {
            auto call = times[i]->make_call();
            call.set_hour(id(saved_sleep_times)[i] / 60);
            call.set_minute(id(saved_sleep_times)[i] % 60);
            call.set_second(0);
            call.perform();
          }
          for (int i = 0; i < 7; i++)
            if (id(saved_sleep_days) & (1 << i))
              days[i]->turn_on();
          id(saved_sleep_valid) = false;

globals:
  - id: saved_sleep_times
    type: std::array<uint16_t, 14>
    restore_value: true
  - id: saved_sleep_days
    type: uint8_t
    restore_value: true
  - id: saved_sleep_valid
    type: bool
    restore_value: true
    initial_value: "false"
