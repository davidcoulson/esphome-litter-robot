substitutions:
  name: litter-robot4
  friendly_name: Litter Robot 4
  version: 2026.10.1

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  project:
    name: Joseph DiGiovanni.Litter Robot 4
    version: ${version}

external_components:
  source:
    type: git
    url: https://codeberg.org/Joseph-DiGiovanni/esphome-litter-robot.git
    ref: LR4/${version}

packages:
  sleep_schedule: !include sleep-schedule.yaml
  wifi: !include wifi.yaml
  hopper: !include hopper.yaml
  hopper_empty_detection: !include { file: ../common/hopper-empty-detection.yaml, vars: { hopper_status_sensor_id: hopper_status, litter_level_sensor_id: litter_level } }
  smart_detection: !include smart-detection.yaml
  auto_cycle: !include auto-cycle.yaml
  cat_tracking: !include ../cat-tracker/default.yaml
  custom_status: !include custom-status.yaml

esp32:
  board: esp32dev
  framework:
    type: esp-idf

uart:
  - id: uart_bus
    tx_pin: GPIO19
    rx_pin:
      number: GPIO5
      ignore_strapping_warning: true
    baud_rate: 256000
    rx_buffer_size: 2048

litter_robot4:
  id: my_litter_robot4

text_sensor:
  - platform: litter_robot4
    type: status
    id: robot_status
    name: "Robot Status"
    internal: true
  - platform: litter_robot4
    type: power_type
    id: power_type
    name: "Power Type"
  - platform: litter_robot4
    type: fault
    id: fault
    name: "Fault"

button:
  - platform: litter_robot4
    type: cycle
    id: cycle
    name: "Manual Cycle"
  - platform: litter_robot4
    type: empty
    id: empty
    name: "Empty Litter"
  - platform: litter_robot4
    type: replace_filter
    id: replace_filter
    name: "Replace Filter"
  - platform: litter_robot4
    type: factory_reset
    id: factory_reset
    name: "Factory Reset"
  - platform: litter_robot4
    type: reset
    id: reset
    name: "Reset"

sensor:
  - platform: litter_robot4
    type: waste_drawer_level
    id: waste_drawer_level
    name: "Waste Drawer Level"
  - platform: litter_robot4
    type: litter_level
    id: litter_level
    name: "Litter Level"
  - platform: litter_robot4
    type: last_cat_weight
    id: last_cat_weight
    name: "Last Cat Weight"
  - platform: litter_robot4
    type: clean_cycle_count
    id: clean_cycle_count
    name: "Clean Cycles"
  - platform: litter_robot4
    type: power_cycle_count
    id: power_cycle_count
    name: "Power Cycles"
    disabled_by_default: true
  - platform: litter_robot4
    type: empty_cycle_count
    id: empty_cycle_count
    name: "Empty Cycles"
    disabled_by_default: true
  - platform: litter_robot4
    type: filter_cycle_count
    id: filter_cycle_count
    name: "Filter Cycles"
    disabled_by_default: true

number:
  - platform: litter_robot4
    type: clean_cycle_delay
    id: clean_cycle_delay
    name: "Clean Cycle Delay"

select:
  - platform: litter_robot4
    type: night_light_mode
    id: night_light_mode
    name: "Night Light Mode"
  - platform: litter_robot4
    type: night_light_brightness
    id: night_light_brightness
    name: "Night Light Brightness"
  - platform: litter_robot4
    type: panel_brightness
    id: panel_brightness
    name: "Panel Brightness"

switch:
  - platform: litter_robot4
    type: control_panel_lockout
    id: control_panel_lockout
    name: "Control Panel Lockout"
  - platform: litter_robot4
    type: power
    id: power
    name: "Power"
  - platform: litter_robot4
    type: debug_mode
    id: debug_mode
    name: "Debug Mode"

binary_sensor:
  - platform: litter_robot4
    type: waste_drawer_full
    id: waste_drawer_full
    name: "Waste Drawer Full"
  - platform: litter_robot4
    type: bonnet
    id: bonnet
    name: "Bonnet"
    disabled_by_default: true
  - platform: litter_robot4
    type: night_light
    id: night_light
    name: "Night Light"
    disabled_by_default: true
  - platform: litter_robot4
    type: sleeping
    id: sleeping
    name: "Sleeping"
  - platform: litter_robot4
    type: curtain_detected
    id: curtain_detected
    name: "Curtain Detected"
  - platform: litter_robot4
    type: weight_detected
    id: weight_detected
    name: "Weight Detected"

globals:
  - id: relock_panel
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  # Simulated panel presses are ignored while Control Panel Lockout is on, so
  # automations press Reset/Cycle through this script, which briefly unlocks.
  - id: press_panel_button
    mode: queued
    parameters:
      cycle: bool
    then:
      - lambda: "id(relock_panel) = id(control_panel_lockout).state;"
      - if:
          condition:
            lambda: "return id(relock_panel);"
          then:
            - switch.turn_off: control_panel_lockout
            - delay: 500ms
      - if:
          condition:
            lambda: "return cycle;"
          then:
            - button.press: cycle
          else:
            - button.press: reset
      - if:
          condition:
            lambda: "return id(relock_panel);"
          then:
            - delay: 500ms
            - switch.turn_on: control_panel_lockout
