esphome:
  on_boot:
    then:
      - if:
          condition:
            lambda: 'return id(smart_detection_enabled);'
          then:
            - switch.turn_on: smart_cat_detection

globals:
  - id: smart_detection_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: cat_clear_seconds
    type: uint32_t
    restore_value: no
    initial_value: '0'

switch:
  - platform: template
    id: smart_cat_detection
    name: "Smart Cat Detection"
    icon: "mdi:check-underline-circle"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - globals.set:
          id: smart_detection_enabled
          value: 'true'
    on_turn_off:
      - globals.set:
          id: smart_detection_enabled
          value: 'false'

binary_sensor:
  - platform: template
    id: cat_confirmed
    name: "Cat Confirmed"
    internal: true

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(smart_detection_enabled)) {
            id(cat_confirmed).publish_state(false);
            id(cat_clear_seconds) = 0;
            return;
          }
          const bool cat_detected = id(robot_status).state == "Cat detected";
          const bool curtain = id(curtain_detected).state;
          const bool weight = id(weight_detected).state;
          if (!cat_detected) {
            id(cat_confirmed).publish_state(false);
            id(cat_clear_seconds) = 0;
            return;
          }
          if (curtain && weight) {
            // Both sensors agree: confirm the cat.
            id(cat_confirmed).publish_state(true);
            id(cat_clear_seconds) = 0;
          } else if (!curtain && !weight) {
            // Neither sensor: count down (10s) before resetting the robot.
            id(cat_clear_seconds) += 1;
            if (id(cat_clear_seconds) == 10 && !id(cat_confirmed).state) {
              id(reset).press();
            }
          } else {
            id(cat_clear_seconds) = 0;
          }
