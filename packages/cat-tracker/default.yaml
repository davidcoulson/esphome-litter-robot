cat_tracker:
  id: cat_tracker_hub
  weight_tolerance: 0.6
  cats: [cat1, cat2, cat3, cat4]

number:
  - platform: cat_tracker
    id: cat1_weight
    name: "Cat 1 Weight"
    cat: cat1
    disabled_by_default: true
  - platform: cat_tracker
    id: cat2_weight
    name: "Cat 2 Weight"
    cat: cat2
    disabled_by_default: true
  - platform: cat_tracker
    id: cat3_weight
    name: "Cat 3 Weight"
    cat: cat3
    disabled_by_default: true
  - platform: cat_tracker
    id: cat4_weight
    name: "Cat 4 Weight"
    cat: cat4
    disabled_by_default: true

sensor:
  - platform: cat_tracker
    cat: cat1
    visits_count:
      id: cat1_visits
      name: "Cat 1 Visits"
      disabled_by_default: true
  - platform: cat_tracker
    cat: cat2
    visits_count:
      id: cat2_visits
      name: "Cat 2 Visits"
      disabled_by_default: true
  - platform: cat_tracker
    cat: cat3
    visits_count:
      id: cat3_visits
      name: "Cat 3 Visits"
      disabled_by_default: true
  - platform: cat_tracker
    cat: cat4
    visits_count:
      id: cat4_visits
      name: "Cat 4 Visits"
      disabled_by_default: true

button:
  - platform: cat_tracker
    id: cat1_tracker_reset
    name: "Cat 1 Tracker Reset"
    cat: cat1
    disabled_by_default: true
  - platform: cat_tracker
    id: cat2_tracker_reset
    name: "Cat 2 Tracker Reset"
    cat: cat2
    disabled_by_default: true
  - platform: cat_tracker
    id: cat3_tracker_reset
    name: "Cat 3 Tracker Reset"
    cat: cat3
    disabled_by_default: true
  - platform: cat_tracker
    id: cat4_tracker_reset
    name: "Cat 4 Tracker Reset"
    cat: cat4
    disabled_by_default: true
