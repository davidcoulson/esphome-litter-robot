esphome:
  project:
    name: "Joseph DiGiovanni.Litter Robot 4 with WasteSense™"
    version: ${version}.waste-sense
  # nvs_erase_key() for the WasteSense Calibration Reset button.
  includes:
    - <nvs.h>

dashboard_import:
  package_import_url: codeberg://Joseph-DiGiovanni/esphome-litter-robot/litter-robot4-waste-sense.yaml@LR4/stable

packages:
  common: !include packages/common/default.yaml
  base: !include packages/litter-robot4/default.yaml
  waste_tracking: !include packages/cat-tracker/waste-tracking/default.yaml
  waste_sense: !include packages/cat-tracker/waste-tracking/waste-sense.yaml
  odor_control: !include packages/litter-robot4/odor-control.yaml

i2c:
  id: i2c_bus
  sda: GPIO13
  scl: GPIO14

bme68x_bsec2_i2c:
  id: bme680
  model: bme680
  address: 0x77

button:
  # Clears only the saved BSEC2 calibration, e.g. after swapping the sensor:
  # the state is keyed by I2C address, so a new sensor would inherit it.
  - platform: template
    id: waste_sense_calibration_reset
    name: "WasteSense Calibration Reset"
    icon: "mdi:database-refresh"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          // Flush queued writes first so a pending BSEC2 state save cannot land
          // after the erase; safe_reboot() runs no loop() that could queue another.
          global_preferences->sync();
          // The I2C subclass overrides get_hash() privately; it is public on the base.
          char key[UINT32_MAX_STR_SIZE];
          uint32_to_str(key, static_cast<bme68x_bsec2::BME68xBSEC2Component *>(id(bme680))->get_hash());
          const uint32_t handle = global_preferences->nvs_handle;
          esp_err_t err = nvs_erase_key(handle, key);
          if (err == ESP_OK)
            err = nvs_commit(handle);
          if (err != ESP_OK && err != ESP_ERR_NVS_NOT_FOUND) {
            ESP_LOGE("waste_sense", "Clearing BSEC2 state failed: %s", esp_err_to_name(err));
            return;
          }
          ESP_LOGI("waste_sense", "BSEC2 state cleared, restarting");
          App.safe_reboot();

sensor:
  - platform: bme68x_bsec2
    bme68x_bsec2_id: bme680
    temperature:
      id: temperature
      name: "Temperature"
      disabled_by_default: true
      filters:
        - offset: -2.78 # ~5 degress fahrenheit
    humidity:
      id: humidity
      name: "Humidity"
      disabled_by_default: true
    iaq:
      id: indoor_air_quality
      name: "Indoor Air Quality"
      disabled_by_default: true
    iaq_accuracy:
      id: iaq_accuracy
      name: "IAQ Accuracy"
      disabled_by_default: true
    pressure:
      id: pressure
      name: "Pressure"
      disabled_by_default: true
    co2_equivalent:
      id: co2
      name: "CO2 Equivalent"
      disabled_by_default: true
    breath_voc_equivalent:
      id: voc
      name: "Breath VOC Equivalent"
      disabled_by_default: true
